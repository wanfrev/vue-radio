server {
    listen 443 ssl http2;
    server_name airemedia.net api.airemedia.net;

    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/airemedia.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airemedia.net/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name radio.airemedia.net;

    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/airemedia.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airemedia.net/privkey.pem;

    location /radio.mp3 {
        proxy_pass http://172.17.0.1:8000/radio.mp3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://172.17.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name airemedia.net api.airemedia.net radio.airemedia.net;
    return 301 https://$host$request_uri;
}
